spring.application.name=Track-My-Expenses-Backend

# ---------------------------------------------------
# Server Configuration
# ---------------------------------------------------
server.port=${PORT:8080}

# ---------------------------------------------------
# MySQL Database Configuration
# ---------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------
# JPA / Hibernate Configuration
# ---------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------------------------------------------------
# Connection Pool (HikariCP)
# ---------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ---------------------------------------------------
# Logging (dev-friendly; dial back before production)
# ---------------------------------------------------
# you can replace the info with debug and off with trace to see your queries. Put them info&off in production
logging.level.org.hibernate.SQL=info
logging.level.org.hibernate.orm.jdbc.bind=off 

# ---------------------------------------------------
# Security - JWT
# ---------------------------------------------------
app.jwt.secret=${APP_JWT_SECRET}

# 24 hours, in milliseconds
app.jwt.expiration-ms=86400000

# ---------------------------------------------------
# OTP (email verification / password reset)
# ---------------------------------------------------
app.otp.expiration-minutes=10

# ---------------------------------------------------
# Email (Resend API) - used to send OTP emails
# RESEND_FROM_EMAIL must be a verified sender/domain in your Resend account,
# e.g. "Track My Expenses <noreply@yourdomain.com>"
# ---------------------------------------------------
brevo.api-key=${BREVO_API_KEY}
brevo.from-email=${BREVO_FROM_EMAIL}
brevo.from-name=${BREVO_FROM_NAME}

# ---------------------------------------------------
# CORS
# ---------------------------------------------------
app.cors.allowed-origins=${FRONTEND_URLS}


